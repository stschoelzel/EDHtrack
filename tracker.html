<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EDHtrack</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="wrap">

        <header class="brand">
            <h1 class="wordmark"><span class="wm-edh">EDH</span><span class="wm-track">track</span></h1>
            <div class="subtitle">Your simple DIY match log.</div>
        </header>

        <section id="screen-main" class="screen active">
            <div class="topbar">
                <span id="who"></span>
                <span class="buttons">
                    <button id="show-stats-btn" class="ghost" style="color:var(--keep)">Show Stats</button>
                    <button id="export-csv-btn" class="ghost" style="color:var(--pending)">Export CSV</button>
                    <button id="main-logout-btn" class="ghost" style="color:var(--fail)">Logout</button>
                </span>
            </div>

            <div class="panel">
                <label>Players &amp; Decks</label>
                <div id="player-rows"></div>
                <button id="add-player" class="add-row-btn">+ Add Player</button>
            </div>

            <div class="panel">
                <div class="field">
                    <label for="game-type">Game Type</label>
                    <input id="game-type" type="text" list="dl-gametypes" />
                    <datalist id="dl-gametypes"></datalist>
                </div>
                <div class="field" style="margin-top:0.75rem">
                    <label for="turn">Turn (optional)</label>
                    <input id="turn" type="number" min="1" inputmode="numeric" />
                </div>
                <div class="field" style="margin-top:0.75rem">
                    <label for="win-cond">Winning Condition (optional)</label>
                    <input id="win-cond" type="text" list="dl-winconds" />
                    <datalist id="dl-winconds"></datalist>
                </div>
            </div>

            <div class="actions">
                <button id="submit-btn" class="primary">Submit Match</button>
                <button id="reset-btn" class="ghost">Reset</button>
            </div>

            <div class="panel" style="margin-top:1rem">
                <label>Data and User Managment</label>
                <div class="actions" style="margin-top:0;">
                    <button id="data-user-management-btn" class="ghost">Data and User Managment</button>
                </div>
            </div>
        </section>

    </div>

    <div id="confirm-popup" class="confirm-popup" aria-hidden="true" hidden>
        <div class="confirm-popup__panel" role="dialog" aria-modal="true" aria-labelledby="confirm-popup-title">
            <h2 id="confirm-popup-title" class="confirm-popup__title">Missing Fields</h2>
            <ul id="confirm-warnings" class="confirm-popup__list"></ul>
            <div class="confirm-popup__actions">
                <button id="confirm-ops" class="confirm-popup__button confirm-popup__button--oops">Oops..</button>
                <button id="confirm-fine" class="confirm-popup__button confirm-popup__button--fine">It's fine</button>
            </div>
        </div>
    </div>

    <datalist id="dl-players"></datalist>
    <datalist id="dl-decks"></datalist>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <script type="module">
        import { checkSession, resolveAppUrl, logout, loadConfig, initGoogle, fetchData, insertRow, upsertData } from "./js/google-sheets-client.js";

        const MAX_PLAYERS = 8;
        const INITIAL_ROWS = 4;

        const state = {
            session: null,
            role: null,
            players: [],
            decks: [],
            gameTypes: [],
            winConditions: [],
            rows: [],
            winners: [0],
            isDraw: false,
        };

        let forceSubmitAsIs = false;

        const $ = (id) => document.getElementById(id);

        function toast(msg, kind = "") {
            const t = document.createElement("div");
            t.className = "toast " + kind;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3500);
        }

        function escapeHtml(s) {
            return String(s ?? "").replace(/[&<>\"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[c]));
        }

        function goToManagerPage() {
            window.location.href = resolveAppUrl("manager.html");
        }

        function fillDatalist(id, items) {
            const dl = $(id);
            dl.innerHTML = "";
            for (const v of items) {
                const o = document.createElement("option");
                o.value = v;
                dl.appendChild(o);
            }
        }

        function renderDatalists() {
            fillDatalist("dl-gametypes", state.gameTypes);
            fillDatalist("dl-winconds", state.winConditions);
        }

        function showMissingFieldsPopup(missingFields) {
            const popup = $("confirm-popup");
            const list = $("confirm-warnings");

            list.innerHTML = missingFields.map(field => `<li>${escapeHtml(field)}</li>`).join("");
            popup.hidden = false;
            popup.classList.add("is-open");
            popup.setAttribute("aria-hidden", "false");
        }

        function hideMissingFieldsPopup() {
            const popup = $("confirm-popup");
            popup.classList.remove("is-open");
            popup.setAttribute("aria-hidden", "true");
            popup.hidden = true;
        }

        function getMissingFields() {
            const missing = [];

            state.rows.forEach((row, idx) => {
                const rowNumber = idx + 1;
                if (!row.player.trim()) missing.push(`Player ${rowNumber} name`);
                if (!row.deck.trim()) missing.push(`Player ${rowNumber} deck`);
            });

            if (!$("game-type").value.trim()) missing.push("Game Type");
            if (!$("turn").value.trim()) missing.push("Turn");
            if (!$("win-cond").value.trim()) missing.push("Winning Condition");

            return missing;
        }

        function updateRowDatalists() {
            state.rows.forEach((r, idx) => {
                const pList = document.getElementById(`dl-players-${idx}`);
                if (pList) {
                    const otherPlayers = state.rows.filter((_, i) => i !== idx).map(x => x.player.trim());
                    pList.innerHTML = state.players.filter(p => !otherPlayers.includes(p)).map(p => `<option value="${escapeHtml(p)}"></option>`).join("");
                }
                const dList = document.getElementById(`dl-decks-${idx}`);
                if (dList) {
                    const otherDecks = state.rows.filter((_, i) => i !== idx).map(x => x.deck.trim());
                    dList.innerHTML = state.decks.filter(d => !otherDecks.includes(d)).map(d => `<option value="${escapeHtml(d)}"></option>`).join("");
                }
            });
        }

        function renderPlayerRows() {
            const wrap = $("player-rows");
            wrap.innerHTML = "";
            state.rows.forEach((r, idx) => {
                const div = document.createElement("div");
                div.className = "player-row";
                const canRemove = state.rows.length > 2;
                const isWinner = state.winners.includes(idx);

                div.innerHTML = `
      <div class="row-head">
        <span class="row-label">Player ${idx + 1}</span>
        ${canRemove ? `<button class="row-remove" data-rm="${idx}">Remove</button>` : ""}
      </div>
      <div class="row">
        <div class="field">
          <label>Player</label>
          <input type="text" list="dl-players-${idx}" data-pidx="${idx}" data-k="player" value="${escapeHtml(r.player)}" />
          <datalist id="dl-players-${idx}"></datalist>
        </div>
        <div class="field">
          <label>Deck</label>
          <input type="text" list="dl-decks-${idx}" data-pidx="${idx}" data-k="deck" value="${escapeHtml(r.deck)}" />
          <datalist id="dl-decks-${idx}"></datalist>
        </div>
      </div>
      <div class="winner-cell">
        <input type="${state.isDraw ? 'checkbox' : 'radio'}" class="winner-toggle" name="winner" id="winner-${idx}" value="${idx}" ${isWinner ? "checked" : ""} />
        <label for="winner-${idx}">Winner</label>
        ${(isWinner || state.isDraw) ? `
          <div style="margin-left: 1rem; display:flex; align-items:center; gap: 0.5rem; opacity: ${state.isDraw ? '1' : '0.5'};">
            <input type="checkbox" id="draw-toggle-${idx}" class="draw-toggle" ${state.isDraw ? "checked" : ""} />
            <label for="draw-toggle-${idx}" style="color:var(--foreground-muted);font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;">DRAW?</label>
          </div>
        ` : ""}
      </div>
    `;
                wrap.appendChild(div);
            });

            wrap.querySelectorAll("input[data-pidx]").forEach(inp => {
                inp.addEventListener("input", (e) => {
                    const i = +e.target.dataset.pidx;
                    const k = e.target.dataset.k;
                    state.rows[i][k] = e.target.value;
                    updateRowDatalists();
                });
            });
            wrap.querySelectorAll("input[name='winner']").forEach(inp => {
                inp.addEventListener("change", (e) => {
                    const val = +e.target.value;
                    if (state.isDraw) {
                        if (e.target.checked) {
                            if (!state.winners.includes(val)) state.winners.push(val);
                        } else {
                            state.winners = state.winners.filter(x => x !== val);
                        }
                    } else {
                        state.winners = [val];
                    }
                    renderPlayerRows();
                });
            });
            wrap.querySelectorAll(".draw-toggle").forEach(inp => {
                inp.addEventListener("change", (e) => {
                    state.isDraw = e.target.checked;
                    if (!state.isDraw && state.winners.length > 1) {
                        state.winners = [state.winners[0]];
                    }
                    if (!state.isDraw && state.winners.length === 0) {
                        state.winners = [0];
                    }
                    renderPlayerRows();
                });
            });
            wrap.querySelectorAll("button[data-rm]").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    const i = +e.target.dataset.rm;
                    state.rows.splice(i, 1);
                    state.winners = state.winners.filter(x => x !== i).map(x => x > i ? x - 1 : x);
                    if (state.winners.length === 0) state.winners = [0];
                    renderPlayerRows();
                });
            });

            $("add-player").disabled = state.rows.length >= MAX_PLAYERS;
            updateRowDatalists();
        }

        function resetForm() {
            state.rows = Array.from({ length: INITIAL_ROWS }, () => ({ player: "", deck: "" }));
            state.winners = [0];
            state.isDraw = false;
            $("game-type").value = "";
            $("turn").value = "";
            $("win-cond").value = "";
            renderPlayerRows();
        }

        async function loadLookups() {
            try {
                const [p, d, g, w] = await Promise.all([
                    fetchData('Players'),
                    fetchData('Decks'),
                    fetchData('Game_Types'),
                    fetchData('Win_Conditions')
                ]);
                state.players = p ? p.map(x => x.name) : [];
                state.decks = d ? d.map(x => x.name) : [];
                state.gameTypes = g ? g.map(x => x.name) : [];
                state.winConditions = w ? w.map(x => x.name) : [];
                renderDatalists();
            } catch (e) {
                console.error(e);
                toast("Error loading lookups", "fail");
            }
        }

        async function submitMatch() {
            const missingFields = forceSubmitAsIs ? [] : getMissingFields();
            if (missingFields.length) {
                showMissingFieldsPopup(missingFields);
                return;
            }

            const gameType = $("game-type").value.trim();
            const winCond = $("win-cond").value.trim();
            const turn = parseInt($("turn").value.trim(), 10) || null;

            if (state.role === 'user') {
                const participantsMissing = state.rows.some(r => !state.players.includes(r.player.trim()) || !state.decks.includes(r.deck.trim()));
                const gameTypeMissing = gameType && !state.gameTypes.includes(gameType);
                const winCondMissing = winCond && !state.winConditions.includes(winCond);

                if (participantsMissing || gameTypeMissing || winCondMissing) {
                    toast("Users can only track matches with existing templates", "fail");
                    return;
                }
            }

            $("submit-btn").disabled = true;
            $("submit-btn").textContent = "Submitting...";

            try {
                if (state.role === 'admin' || state.role === 'editor') {
                    const newP = Array.from(new Set(state.rows.map(r => r.player.trim()).filter(Boolean))).map(name => ({ name }));
                    const newD = Array.from(new Set(state.rows.map(r => r.deck.trim()).filter(Boolean))).map(name => ({ name }));
                    if (newP.length) await upsertData('Players', newP, 'name');
                    if (newD.length) await upsertData('Decks', newD, 'name');
                    if (gameType) {
                        await upsertData('Game_Types', [{ name: gameType }], 'name');
                    }
                    if (winCond) {
                        await upsertData('Win_Conditions', [{ name: winCond }], 'name');
                    }
                }

                const participants = state.rows.map(r => {
                    return {
                        player: r.player.trim(),
                        deck: r.deck.trim()
                    };
                });

                const winnerNames = state.winners.map(idx => state.rows[idx].player.trim()).join(", ");

                const matchRow = {
                    played_at: new Date().toISOString().split('T')[0],
                    participants: participants,
                    winner: winnerNames,
                    is_draw: state.isDraw,
                    turn: isNaN(turn) ? null : turn,
                    win_condition: winCond || null,
                    game_type: gameType,
                };

                await insertRow('Matches', matchRow);

                toast("Match saved!", "keep");
                resetForm();
                await loadLookups();
            } catch (e) {
                console.error(e);
                toast(e.message || "Error saving match", "fail");
            } finally {
                $("submit-btn").disabled = false;
                $("submit-btn").textContent = "Submit Match";
                forceSubmitAsIs = false;
            }
        }

        async function handleLogout() {
            await logout();
            window.location.replace(resolveAppUrl("index.html"));
        }

        function csvEscape(s) {
            s = String(s ?? "");
            if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
            return s;
        }

        async function exportCSV() {
            toast("Exporting...", "keep");
            try {
                let matches = await fetchData('Matches');
                if (!matches || !matches.length) return toast("No matches found", "fail");

                // Sort matches by played_at if possible
                matches.sort((a, b) => {
                    const dateA = a.played_at ? new Date(a.played_at) : new Date(0);
                    const dateB = b.played_at ? new Date(b.played_at) : new Date(0);
                    return dateA - dateB;
                });

                let csv = "ID,Date,Participants,Winner,Turn,WinCondition,GameType\n";
                matches.forEach(m => {
                    let partsStr = "";
                    if (m.participants) {
                        try {
                            const pArr = typeof m.participants === 'string' ? JSON.parse(m.participants) : m.participants;
                            partsStr = pArr.filter(p => p.player).map(p => `${p.player} (${p.deck})`).join(" | ");
                        } catch(e) {}
                    }

                    const row = [
                        m.id,
                        m.played_at || "",
                        partsStr,
                        m.winner || "",
                        m.turn || "",
                        m.win_condition || "",
                        m.game_type || ""
                    ];
                    csv += row.map(csvEscape).join(",") + "\n";
                });

                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.setAttribute("download", `edhtrack_matches_${new Date().toISOString().slice(0, 10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (e) {
                console.error(e);
                toast("Error fetching matches", "fail");
            }
        }

        async function boot() {
            // Wait for google libraries
            if (typeof gapi === 'undefined' || typeof google === 'undefined') {
                setTimeout(boot, 100);
                return;
            }

            const cfg = loadConfig();
            if (cfg.clientId && cfg.apiKey) {
                try {
                    await initGoogle(cfg.clientId, cfg.apiKey);
                } catch(e) {
                    window.location.replace(resolveAppUrl("index.html"));
                    return;
                }
            } else {
                window.location.replace(resolveAppUrl("index.html"));
                return;
            }

            const context = await checkSession();
            if (!context) return;

            state.session = context.session;
            state.role = context.allowed?.role || 'user';

            $("who").textContent = context.allowed.display_name + (state.role === "admin" ? " (Admin)" : state.role === "editor" ? " (Editor)" : "");

            const wm = document.querySelector('.wordmark');
            if (wm) {
                wm.style.cursor = 'pointer';
                wm.addEventListener('click', () => {
                    window.location.href = resolveAppUrl('tracker.html');
                });
            }

            $("add-player").addEventListener("click", () => {
                if (state.rows.length < MAX_PLAYERS) {
                    state.rows.push({ player: "", deck: "" });
                    renderPlayerRows();
                }
            });
            $("reset-btn").addEventListener("click", resetForm);
            $("submit-btn").addEventListener("click", () => {
                forceSubmitAsIs = false;
                submitMatch();
            });
            $("show-stats-btn").addEventListener("click", () => toast("Stats coming soon", "keep"));
            $("export-csv-btn").addEventListener("click", exportCSV);
            $("main-logout-btn").addEventListener("click", handleLogout);
            $("data-user-management-btn").addEventListener("click", goToManagerPage);
            $("confirm-ops").addEventListener("click", hideMissingFieldsPopup);
            $("confirm-fine").addEventListener("click", async () => {
                hideMissingFieldsPopup();
                forceSubmitAsIs = true;
                await submitMatch();
            });
            $("confirm-popup").addEventListener("click", (e) => {
                if (e.target.id === "confirm-popup") hideMissingFieldsPopup();
            });

            document.addEventListener('focusin', e => {
                if (e.target.tagName === 'INPUT' && e.target.getAttribute('list')) {
                    e.target._oldVal = e.target.value;
                    e.target.value = '';
                }
            });
            document.addEventListener('focusout', e => {
                if (e.target.tagName === 'INPUT' && e.target.getAttribute('list')) {
                    if (e.target.value === '' && e.target._oldVal) {
                        e.target.value = e.target._oldVal;
                    }
                }
            });

            await loadLookups();
            resetForm();
        }

        document.addEventListener("DOMContentLoaded", boot);
    </script>
</body>

</html>
