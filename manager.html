<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EDHtrack - Manager</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="wrap">

        <header class="brand">
            <h1 class="wordmark"><span class="wm-edh">EDH</span><span class="wm-track">track</span></h1>
            <div class="subtitle">Data and user management.</div>
        </header>

        <section class="screen active">
            <div class="topbar">
                <span id="manager-who"></span>
                <button id="back-to-main-btn" class="ghost">Back to Match Form</button>
            </div>

            <div class="panel">
                <label>Edit Tools</label>
                <div class="admin-tools-grid">
                    <button id="edit-decks-btn" class="ghost">Edit Decks</button>
                    <button id="edit-players-btn" class="ghost">Edit Players</button>
                    <button id="edit-game-types-btn" class="ghost">Edit Game Types</button>
                    <button id="edit-win-conditions-btn" class="ghost">Edit Winning Conditions</button>
                </div>
            </div>

            <div class="panel" id="data-list-panel" style="display:none;">
                <div class="topbar" style="margin-bottom: 1rem;">
                    <label id="data-list-title"></label>
                    <button id="close-data-list-btn" class="ghost">Back to Tools</button>
                </div>
                <div id="data-rows" class="muted">Loading...</div>
            </div>
        </section>

    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <script type="module">
        import { checkSession, resolveAppUrl, initGoogle, loadConfig, fetchData, deleteRow } from "./js/google-sheets-client.js";

        const $ = (id) => document.getElementById(id);

        const state = {
            session: null,
            allowed: null,
            role: null,
        };

        function toast(msg, kind = "") {
            const t = document.createElement("div");
            t.className = "toast " + kind;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3500);
        }

        function escapeHtml(s) {
            return String(s ?? "").replace(/[&<>\"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[c]));
        }

        async function renderDataList(tableName, title) {
            if (state.role !== 'admin') return toast("Only admins can manage data", "fail");
            $("data-list-panel").style.display = "block";
            $("data-list-title").textContent = title;
            $("data-rows").innerHTML = "Loading...";

            try {
                const data = await fetchData(tableName);

                // Sort by name
                if (data && data.length) {
                    data.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
                }

                const rowsDiv = $("data-rows");
                rowsDiv.innerHTML = "";

                if (data && data.length) {
                    data.forEach(item => {
                        const d = document.createElement("div");
                        d.className = "list-item";
                        d.innerHTML = `<span>${escapeHtml(item.name)}</span> <button data-id="${item.id}" class="row-remove">Delete</button>`;
                        rowsDiv.appendChild(d);
                    });

                    rowsDiv.querySelectorAll('button').forEach(btn => btn.addEventListener('click', async (e) => {
                        const id = e.target.dataset.id;
                        if (confirm("Delete this item?")) {
                            try {
                                await deleteRow(tableName, id);
                                renderDataList(tableName, title);
                            } catch (delErr) {
                                toast(delErr.message || "Failed to delete item", "fail");
                            }
                        }
                    }));
                } else {
                    rowsDiv.textContent = "No entries found.";
                }
            } catch (error) {
                $("data-rows").innerHTML = "Error loading data.";
                return toast(error.message || "Error fetching data", "fail");
            }
        }

        async function boot() {
            // Wait for google libraries
            if (typeof gapi === 'undefined' || typeof google === 'undefined') {
                setTimeout(boot, 100);
                return;
            }

            const cfg = loadConfig();
            if (cfg.clientId && cfg.apiKey) {
                try {
                    await initGoogle(cfg.clientId, cfg.apiKey);
                } catch(e) {
                    window.location.replace(resolveAppUrl("index.html"));
                    return;
                }
            } else {
                window.location.replace(resolveAppUrl("index.html"));
                return;
            }

            const context = await checkSession();
            if (!context) return;

            state.session = context.session;
            state.allowed = context.allowed;

            state.role = context.allowed.role;
            $("manager-who").textContent = context.allowed.display_name + (state.role === "admin" ? " (Admin)" : state.role === "editor" ? " (Editor)" : "");

            const wm = document.querySelector('.wordmark');
            if (wm) {
                wm.style.cursor = 'pointer';
                wm.addEventListener('click', () => {
                    window.location.href = resolveAppUrl('tracker.html');
                });
            }

            $("back-to-main-btn").addEventListener("click", () => {
                window.location.href = resolveAppUrl("tracker.html");
            });
            $("edit-decks-btn").addEventListener("click", () => renderDataList("Decks", "Manage Decks"));
            $("close-data-list-btn").addEventListener("click", () => $("data-list-panel").style.display = "none");
            $("edit-players-btn").addEventListener("click", () => renderDataList("Players", "Manage Players"));
            $("edit-game-types-btn").addEventListener("click", () => renderDataList("Game_Types", "Manage Game Types"));
            $("edit-win-conditions-btn").addEventListener("click", () => renderDataList("Win_Conditions", "Manage Winning Conditions"));

            if (state.role !== "admin") { document.querySelectorAll(".admin-tools-grid").forEach(el => el.style.display = "none"); }
        }

        document.addEventListener("DOMContentLoaded", boot);
    </script>
</body>

</html>
