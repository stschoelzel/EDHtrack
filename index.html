<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EDHtrack</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="wrap">
        <header class="brand">
            <h1 class="wordmark"><span class="wm-edh">EDH</span><span class="wm-track">track</span></h1>
            <div class="subtitle">Your simple DIY match log.</div>
        </header>

        <section id="screen-config" class="screen">
            <div class="panel">
                <label>Welcome</label>
                <p class="muted">Connect your Google account to sync data directly to a Google Sheet in your Google Drive.</p>
            </div>

            <div id="setup-phase-a" class="panel">
                <label>Phase 1: App Connection</label>
                <p class="muted">Enter your Google OAuth details to connect the app.</p>
                <div class="field" style="margin-top:0.75rem">
                    <label for="cfg-client">Google Client ID</label>
                    <input id="cfg-client" type="text" autocomplete="off" spellcheck="false" />
                </div>
                <div class="field" style="margin-top:0.75rem">
                    <label for="cfg-key">Google API Key</label>
                    <input id="cfg-key" type="text" autocomplete="off" spellcheck="false" />
                </div>
                <div id="cfg-err" class="err" style="display:none"></div>
                <div class="actions">
                    <button id="cfg-save-btn" class="primary">Connect</button>
                </div>
            </div>

            <div id="setup-phase-b" class="panel" style="display:none">
                <label>Phase 2: Self Authentication</label>
                <p class="muted">Connection successful! Now login to allow access to your Google Drive.</p>
                <div class="actions">
                    <button id="cfg-login-google-btn" class="primary" style="background:#DB4437;border-color:#DB4437;color:white;">Login with Google</button>
                </div>
            </div>
        </section>

        <section id="screen-login" class="screen">
            <div class="panel">
                <label>Sign In</label>
                <p class="muted">Authenticate to access and submit matches.</p>
                <div class="actions" style="flex-direction:column">
                    <button id="login-google-btn" class="primary"
                        style="background:#DB4437;border-color:#DB4437;color:white;">Login with Google</button>
                </div>
                <div class="actions" style="margin-top:1rem">
                    <button id="login-reset-cfg-btn" class="ghost danger">Reset Setup</button>
                </div>
            </div>
        </section>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <script type="module">
        import {
            initGoogle,
            login,
            logout,
            getSessionContext,
            loadConfig,
            resolveAppUrl,
            saveConfig,
            clearConfig,
        } from "./js/google-sheets-client.js";

        const state = {};
        const $ = (id) => document.getElementById(id);

        function showScreen(id) {
            for (const s of document.querySelectorAll(".screen")) s.classList.remove("active");
            $(id).classList.add("active");
        }

        function toast(msg, kind = "") {
            const t = document.createElement("div");
            t.className = "toast " + kind;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3500);
        }

        async function doLogin() {
            try {
                toast("Logging in...", "keep");
                await login();
                window.location.replace(resolveAppUrl("tracker.html"));
            } catch (error) {
                toast(error.message || "Login failed", "fail");
            }
        }

        async function handleLogout() {
            await logout();
            window.location.reload();
        }

        async function resetSetup() {
            if (confirm("Reset setup on this device? You will need to enter the Google Client ID and API Key again.")) {
                clearConfig();
                await handleLogout();
            }
        }

        async function boot() {
            // wait for google libraries to load before boot check
            const tryBoot = async () => {
                if (typeof gapi === 'undefined' || typeof google === 'undefined') {
                    setTimeout(tryBoot, 100);
                    return;
                }

                const cfg = loadConfig();
                if (cfg.clientId && cfg.apiKey) {
                    $("cfg-client").value = cfg.clientId;
                    $("cfg-key").value = cfg.apiKey;

                    try {
                        await initGoogle(cfg.clientId, cfg.apiKey);
                        const context = await getSessionContext();
                        if (context) {
                            window.location.replace(resolveAppUrl("tracker.html"));
                            return;
                        }
                        $("setup-phase-a").style.display = "none";
                        $("setup-phase-b").style.display = "block";
                        showScreen("screen-login");
                    } catch (e) {
                        toast(e.message || "Failed to initialize Google API", "fail");
                        showScreen("screen-config");
                    }
                } else {
                    showScreen("screen-config");
                }
            };
            tryBoot();

            $("cfg-save-btn").addEventListener("click", async () => {
                const clientId = $("cfg-client").value.trim();
                const apiKey = $("cfg-key").value.trim();
                if (!clientId || !apiKey) return toast("All fields required", "fail");

                $("cfg-save-btn").disabled = true;
                $("cfg-save-btn").textContent = "Connecting...";
                try {
                    await initGoogle(clientId, apiKey);
                    saveConfig({ clientId, apiKey });
                    $("setup-phase-a").style.display = "none";
                    $("setup-phase-b").style.display = "block";
                    showScreen("screen-login");
                } catch (e) {
                    toast(e.message || "Connection failed", "fail");
                } finally {
                    $("cfg-save-btn").disabled = false;
                    $("cfg-save-btn").textContent = "Connect";
                }
            });

            $("cfg-login-google-btn").addEventListener("click", doLogin);
            $("login-google-btn").addEventListener("click", doLogin);
            $("login-reset-cfg-btn").addEventListener("click", resetSetup);

            const wm = document.querySelector('.wordmark');
            if (wm) {
                wm.style.cursor = 'pointer';
                wm.addEventListener('click', () => {
                    window.location.href = resolveAppUrl('tracker.html');
                });
            }
        }

        document.addEventListener("DOMContentLoaded", boot);
    </script>
</body>

</html>
